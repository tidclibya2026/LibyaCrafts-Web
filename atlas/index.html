<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../css/style.css"><style>body{background:#f5f1e8;color:#123b40;font-family:Tahoma,Arial,sans-serif}header{background:#123b40;color:white;padding:24px;border-bottom:4px solid #c4a064}main{max-width:1200px;margin:auto;padding:20px}nav a{color:inherit;margin:8px}section{background:white;border:1px solid #ddd;border-radius:12px;padding:20px;margin:16px 0}.metrics{display:flex;flex-wrap:wrap;gap:12px}.metrics div{flex:1;min-width:120px;background:white;padding:20px;border-top:4px solid #c4a064;border-radius:8px}.metrics strong{display:block;font-size:32px}.barrow{display:grid;grid-template-columns:140px 1fr 45px;gap:10px;align-items:center;margin:10px 0}.track{background:#eee;height:14px;border-radius:5px;overflow:hidden}.fill{height:100%;background:#28665c}select{max-width:100%;padding:10px}small{line-height:1.8}@media print{nav,button,select{display:none}}</style><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><title>الأطلس الوطني للصناعات التقليدية</title><header><small>دولة ليبيا · المنصة الوطنية للصناعات التقليدية</small><h1>الأطلس الوطني للصناعات التقليدية</h1><nav><a href="../">الرئيسية</a><a href="../atlas/">الأطلس</a><a href="../statistics/">الإحصائيات</a></nav></header><main><section><h2>التوزيع الجغرافي لسجلات الحصر 2026</h2><label>المدينة <select id="city"><option value="">جميع المدن</option></select></label><p id="detail">اختر مدينة لاستعراض المؤشر.</p><div id="map" style="height:65vh;min-height:350px;direction:ltr"></div><p><small>مراكز المدن تقريبية، وليست مواقع الحرفيين أو حدوداً إدارية معتمدة. الأعداد الصغيرة محجوبة. طبقة البلديات مؤجلة لحين الاعتماد.</small></p></section><p id="source"></p></main><script>fetch('../data/statistics-2026.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{const map=L.map('map').setView([27,17],5),sel=document.getElementById('city'),detail=document.getElementById('detail');L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:18}).addTo(map);const layer=L.layerGroup().addTo(map);function draw(){layer.clearLayers();d.cities.filter(x=>!sel.value||x[0]===sel.value).forEach(x=>{const label=x[0]+' — '+(x[1]===null?'العدد محجوب':x[1]+' سجل');const marker=L.circleMarker([x[2],x[3]],{radius:x[1]===null?5:5+Math.sqrt(x[1]),color:'#123b40',fillColor:'#c4a064',fillOpacity:.8}).addTo(layer).bindTooltip(label).bindPopup(label);marker.on('click',()=>{detail.textContent=label});if(sel.value){map.setView([x[2],x[3]],8);detail.textContent=label;marker.openPopup()}});if(!sel.value){map.setView([27,17],5);detail.textContent='طرابلس: أعلى عدد سجلات ضمن المدن المعروضة'}}d.cities.forEach(x=>sel.add(new Option(x[0],x[0])));sel.onchange=draw;draw();document.getElementById('source').textContent=d.source}).catch(()=>document.getElementById('detail').textContent='تعذر تحميل الخريطة أو البيانات');</script></html>
